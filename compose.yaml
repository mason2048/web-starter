name: web-starter

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: web_starter
      MYSQL_USER: ${WEB_STARTER_DB_USERNAME:?set WEB_STARTER_DB_USERNAME}
      MYSQL_PASSWORD: ${WEB_STARTER_DB_PASSWORD:?set WEB_STARTER_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${WEB_STARTER_DB_ROOT_PASSWORD:?set WEB_STARTER_DB_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      WEB_STARTER_REDIS_PASSWORD: ${WEB_STARTER_REDIS_PASSWORD:?set WEB_STARTER_REDIS_PASSWORD}
      TZ: Asia/Shanghai
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$WEB_STARTER_REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$WEB_STARTER_REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

  app:
    image: ${WEB_STARTER_APP_IMAGE:-web-starter-app}:${WEB_STARTER_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WEB_STARTER_DB_URL: jdbc:mysql://mysql:3306/web_starter?useUnicode=true&characterEncoding=utf8&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      WEB_STARTER_DB_USERNAME: ${WEB_STARTER_DB_USERNAME:?set WEB_STARTER_DB_USERNAME}
      WEB_STARTER_DB_PASSWORD: ${WEB_STARTER_DB_PASSWORD:?set WEB_STARTER_DB_PASSWORD}
      WEB_STARTER_REDIS_HOST: redis
      WEB_STARTER_REDIS_PORT: 6379
      WEB_STARTER_REDIS_PASSWORD: ${WEB_STARTER_REDIS_PASSWORD:?set WEB_STARTER_REDIS_PASSWORD}
      WEB_STARTER_REDIS_DATABASE: ${WEB_STARTER_REDIS_DATABASE:-0}
      WEB_STARTER_TOKEN_PEPPER: ${WEB_STARTER_TOKEN_PEPPER:?set WEB_STARTER_TOKEN_PEPPER}
      WEB_STARTER_BOOTSTRAP_ADMIN_USERNAME: ${WEB_STARTER_BOOTSTRAP_ADMIN_USERNAME:-admin}
      WEB_STARTER_BOOTSTRAP_ADMIN_PASSWORD: ${WEB_STARTER_BOOTSTRAP_ADMIN_PASSWORD:-}
      WEB_STARTER_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${WEB_STARTER_BOOTSTRAP_ADMIN_DISPLAY_NAME:-系统管理员}
      WEB_STARTER_OAUTH_ISSUER: ${WEB_STARTER_OAUTH_ISSUER:-http://localhost:8088}
      WEB_STARTER_OAUTH_RESOURCE_AUDIENCE: ${WEB_STARTER_OAUTH_RESOURCE_AUDIENCE:-http://localhost:8088/mcp}
      WEB_STARTER_OAUTH_ACCESS_TOKEN_TTL: ${WEB_STARTER_OAUTH_ACCESS_TOKEN_TTL:-10m}
      WEB_STARTER_OAUTH_REFRESH_TOKEN_TTL: ${WEB_STARTER_OAUTH_REFRESH_TOKEN_TTL:-8h}
      WEB_STARTER_INTERNAL_TOKENS_ENABLED: ${WEB_STARTER_INTERNAL_TOKENS_ENABLED:-true}
      WEB_STARTER_MCP_ALLOWED_HOSTS: "${WEB_STARTER_MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*,[::1],[::1]:*}"
      WEB_STARTER_MCP_ALLOWED_ORIGINS: "${WEB_STARTER_MCP_ALLOWED_ORIGINS:-http://localhost,http://localhost:*,https://localhost,https://localhost:*,http://127.0.0.1,http://127.0.0.1:*,https://127.0.0.1,https://127.0.0.1:*,http://[::1],http://[::1]:*,https://[::1],https://[::1]:*}"
      WEB_STARTER_OAUTH_DEVELOPMENT_KEYS_ALLOWED: ${WEB_STARTER_OAUTH_DEVELOPMENT_KEYS_ALLOWED:-false}
      WEB_STARTER_OAUTH_RSA_PRIVATE_KEY: ${WEB_STARTER_OAUTH_RSA_PRIVATE_KEY:-}
      WEB_STARTER_OAUTH_RSA_PUBLIC_KEY: ${WEB_STARTER_OAUTH_RSA_PUBLIC_KEY:-}
      WEB_STARTER_COOKIE_SECURE: ${WEB_STARTER_COOKIE_SECURE:-false}
      WEB_STARTER_SERVER_PORT: 8080
      WEB_STARTER_LOG_LEVEL: ${WEB_STARTER_LOG_LEVEL:-INFO}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - app
      - data

  nginx:
    image: ${WEB_STARTER_NGINX_IMAGE:-web-starter-nginx}:${WEB_STARTER_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${WEB_STARTER_HTTP_BIND_ADDRESS:-0.0.0.0}:${WEB_STARTER_HTTP_PORT:-8088}:8080"
    networks:
      - app

volumes:
  mysql-data:
  redis-data:

networks:
  app:
  data:
    internal: true
