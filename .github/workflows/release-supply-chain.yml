name: release-supply-chain

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing annotated Git tag at the selected commit, for example v2.0.0-rc.1
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: release-supply-chain-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  SYFT_VERSION: "1.44.0"
  SYFT_CHECKSUMS_SHA256: fa24ce6cafe6edbdba166414ce79de8142fbc217f8167e418dfb09e5aedfbf4e
  TRIVY_VERSION: "0.72.0"
  TRIVY_CHECKSUMS_SHA256: ebe9d19a774b950e240b1017a038e9b5a002ea068e02023369ff6d241c10c580

jobs:
  build-scan-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: release
    steps:
      # These two steps must remain first and second.  The first uses only
      # github.token to verify the release Environment protection rule.  The
      # second is the only pre-checkout consumer of the protected anchor
      # bundle; no repository-variable or environment-variable REST fallback
      # is accepted.
      - name: Verify protected release Environment
        id: release_environment_guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" != "Linux" || "${RUNNER_ARCH}" != "X64" ]]; then
            echo "release and AC40 dependency seed require a Linux/X64 runner" >&2
            exit 1
          fi

          private_root="${RUNNER_TEMP}/web-starter-release-trust-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          download_root="${RUNNER_TEMP}/web-starter-ac40-seed-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          seed_parent="${RUNNER_TEMP}/web-starter-ac40-seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          receipt_root="${RUNNER_TEMP}/web-starter-ac40-seed-receipt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for path in "${private_root}" "${download_root}" "${seed_parent}" "${receipt_root}"; do
            if [[ -e "${path}" || -L "${path}" ]]; then
              echo "release trust private path already exists: ${path}" >&2
              exit 1
            fi
          done
          umask 077
          mkdir -m 700 "${private_root}" "${download_root}" "${receipt_root}"

          environment_metadata="${private_root}/environment.json"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output "${environment_metadata}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/environments/release"
          chmod 600 "${environment_metadata}"
          if ! jq -e '
                .name == "release"
                and (.protection_rules | type == "array")
                and any(
                  .protection_rules[];
                  .type == "required_reviewers"
                  and (.reviewers | type == "array")
                  and (.reviewers | length > 0)
                )
              ' "${environment_metadata}" >/dev/null; then
            echo "release Environment must exist and contain a non-empty required_reviewers protection rule" >&2
            exit 1
          fi
          rm -f "${environment_metadata}"
          {
            echo "private_root=${private_root}"
            echo "download_root=${download_root}"
            echo "seed_parent=${seed_parent}"
            echo "receipt_root=${receipt_root}"
          } >> "${GITHUB_OUTPUT}"

      - name: Authorize immutable AC40 dependency seed artifact
        id: release_environment
        shell: bash
        env:
          AC40_SEED_ANCHORS: ${{ secrets.WEB_STARTER_AC40_DEPENDENCY_SEED_ANCHORS }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          PRIVATE_ROOT: ${{ steps.release_environment_guard.outputs.private_root }}
          DOWNLOAD_ROOT: ${{ steps.release_environment_guard.outputs.download_root }}
          SEED_PARENT: ${{ steps.release_environment_guard.outputs.seed_parent }}
          RECEIPT_ROOT: ${{ steps.release_environment_guard.outputs.receipt_root }}
        run: |
          set -euo pipefail
          anchor_file="${PRIVATE_ROOT}/anchors.json"
          python3 -B - "${anchor_file}" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          class InvalidAnchors(Exception):
              pass

          def exact_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise InvalidAnchors
                  result[key] = value
              return result

          raw = os.environ.get("AC40_SEED_ANCHORS", "")
          expected_keys = {
              "aggregateSha256", "archiveSha256", "artifactId", "workflowRunId"
          }
          try:
              if not raw or "\n" in raw or "\r" in raw:
                  raise InvalidAnchors
              document = json.loads(
                  raw,
                  object_pairs_hook=exact_object,
                  parse_constant=lambda _value: (_ for _ in ()).throw(InvalidAnchors()),
              )
              if not isinstance(document, dict) or set(document) != expected_keys:
                  raise InvalidAnchors
              if any(
                  isinstance(document[name], bool)
                  or not isinstance(document[name], int)
                  or document[name] < 1
                  or document[name] > 9_007_199_254_740_991
                  for name in ("artifactId", "workflowRunId")
              ):
                  raise InvalidAnchors
              if any(
                  not isinstance(document[name], str)
                  or re.fullmatch(r"[0-9a-f]{64}", document[name]) is None
                  for name in ("archiveSha256", "aggregateSha256")
              ):
                  raise InvalidAnchors
              canonical = json.dumps(
                  document,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              if raw != canonical:
                  raise InvalidAnchors
          except (InvalidAnchors, json.JSONDecodeError, TypeError, ValueError):
              raise SystemExit(
                  "WEB_STARTER_AC40_DEPENDENCY_SEED_ANCHORS must be exact canonical JSON"
              )

          target = Path(sys.argv[1]).absolute()
          root = target.parent
          root_metadata = root.lstat()
          if root.is_symlink() or not stat.S_ISDIR(root_metadata.st_mode) \
                  or root_metadata.st_uid != os.getuid() \
                  or stat.S_IMODE(root_metadata.st_mode) != 0o700:
              raise SystemExit("release trust root is not a caller-owned mode-0700 directory")
          descriptor = os.open(
              target,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
              0o600,
          )
          with os.fdopen(descriptor, "w", encoding="utf-8") as stream:
              stream.write(canonical + "\n")
              stream.flush()
              os.fsync(stream.fileno())
          PY
          unset AC40_SEED_ANCHORS

          artifact_id="$(jq -er '.artifactId | tostring' "${anchor_file}")"
          artifact_run_id="$(jq -er '.workflowRunId | tostring' "${anchor_file}")"
          archive_sha256="$(jq -er '.archiveSha256' "${anchor_file}")"
          seed_sha256="$(jq -er '.aggregateSha256' "${anchor_file}")"
          producer_sha="${GITHUB_SHA}"

          api_get() {
            local target="$1"
            local url="$2"
            curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --output "${target}" \
              "${url}"
            chmod 600 "${target}"
          }

          artifact_metadata="${PRIVATE_ROOT}/artifact.json"
          workflow_run_metadata="${PRIVATE_ROOT}/workflow-run.json"
          api_get "${artifact_metadata}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          api_get "${workflow_run_metadata}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${artifact_run_id}"

          if ! jq -e \
                --argjson artifact_id "${artifact_id}" \
                --argjson run_id "${artifact_run_id}" \
                --argjson repository_id "${EXPECTED_REPOSITORY_ID}" \
                --arg name "web-starter-ac40-dependency-seed-linux-x86_64.tar" \
                --arg digest "sha256:${archive_sha256}" \
                --arg producer_sha "${producer_sha}" '
              .id == $artifact_id
              and .name == $name
              and .digest == $digest
              and .expired == false
              and .workflow_run.id == $run_id
              and .workflow_run.repository_id == $repository_id
              and .workflow_run.head_repository_id == $repository_id
              and .workflow_run.head_sha == $producer_sha
            ' "${artifact_metadata}" >/dev/null; then
            echo "AC40 artifact identity or producer provenance does not match the protected release Environment" >&2
            exit 1
          fi
          if ! jq -e \
                --argjson run_id "${artifact_run_id}" \
                --argjson repository_id "${EXPECTED_REPOSITORY_ID}" \
                --arg producer_sha "${producer_sha}" \
                --arg producer_workflow ".github/workflows/build-ac40-dependency-seed.yml" '
              .id == $run_id
              and .repository.id == $repository_id
              and .head_repository.id == $repository_id
              and .head_sha == $producer_sha
              and .event == "workflow_dispatch"
              and (
                .path == $producer_workflow
                or (.path | startswith($producer_workflow + "@"))
              )
              and .status == "completed"
              and .conclusion == "success"
            ' "${workflow_run_metadata}" >/dev/null; then
            echo "AC40 producer workflow run is not a successful trusted same-repository run" >&2
            exit 1
          fi

          rm -f "${anchor_file}" "${artifact_metadata}" "${workflow_run_metadata}"
          rmdir "${PRIVATE_ROOT}"
          {
            echo "artifact_id=${artifact_id}"
            echo "artifact_run_id=${artifact_run_id}"
            echo "archive_sha256=${archive_sha256}"
            echo "seed_sha256=${seed_sha256}"
            echo "producer_sha=${producer_sha}"
            echo "head_repository_id=${EXPECTED_REPOSITORY_ID}"
            echo "download_root=${DOWNLOAD_ROOT}"
            echo "seed_parent=${SEED_PARENT}"
            echo "receipt_root=${RECEIPT_ROOT}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve immutable candidate names
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${DISPATCH_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            echo "release workflow requires a tag push or explicit dispatch tag" >&2
            exit 1
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "release must use a v-prefixed semantic Git tag" >&2
            exit 1
          fi
          tag_ref="refs/tags/${release_tag}"
          if [[ "$(git cat-file -t "${tag_ref}" 2>/dev/null || true)" != "tag" ]]; then
            echo "release tag must exist and be annotated" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" || "${head_commit}" != "${GITHUB_SHA}" ]]; then
            echo "release tag, checked-out HEAD and GitHub commit must be identical" >&2
            exit 1
          fi
          version="${release_tag#v}"
          repository="${GITHUB_REPOSITORY,,}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "app_image=ghcr.io/${repository}/app" >> "${GITHUB_OUTPUT}"
          echo "nginx_image=ghcr.io/${repository}/nginx" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-starter-web/pnpm-lock.yaml

      - name: Run repository policy tests and secret gate
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
          python3 -B scripts/repository_policy.py secrets
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Verify frontend
        working-directory: web-starter-web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Require tracked checkout to remain release-tag exact
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=no)" ]]; then
            echo "tracked checkout differs from the annotated release tag" >&2
            git status --short --untracked-files=no >&2
            exit 1
          fi

      - name: Materialize an exact release commit build context
        id: release_context
        shell: bash
        run: |
          release_context="${RUNNER_TEMP}/web-starter-release-context-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "${release_context}" ]]; then
            echo "release Git context destination already exists" >&2
            exit 1
          fi
          mkdir -m 700 "${release_context}"
          git archive --format=tar "${GITHUB_SHA}" | tar -xf - -C "${release_context}"
          echo "path=${release_context}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Candidate tags are content-addressed by commit and are not production
      # release tags. Promotion happens only after the digest-bound gate passes.
      - name: Build and push app candidate
        id: app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Build only from the git archive materialized from GITHUB_SHA, never
          # from test-created, ignored or otherwise untracked workspace files.
          context: ${{ steps.release_context.outputs.path }}
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.release.outputs.app_image }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and push Nginx candidate
        id: nginx
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ steps.release_context.outputs.path }}
          file: ./deploy/nginx/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.release.outputs.nginx_image }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Install checksum-verified Syft and Trivy
        shell: bash
        run: |
          mkdir -p .release-tools artifacts/raw

          syft_checksums="syft_${SYFT_VERSION}_checksums.txt"
          syft_archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${syft_checksums}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${syft_checksums}"
          echo "${SYFT_CHECKSUMS_SHA256}  ${syft_checksums}" | sha256sum --check --strict
          curl --fail --silent --show-error --location \
            --output "${syft_archive}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${syft_archive}"
          grep "  ${syft_archive}$" "${syft_checksums}" | sha256sum --check --strict
          tar -xzf "${syft_archive}" -C .release-tools syft

          trivy_checksums="trivy_${TRIVY_VERSION}_checksums.txt"
          trivy_archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${trivy_checksums}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${trivy_checksums}"
          echo "${TRIVY_CHECKSUMS_SHA256}  ${trivy_checksums}" | sha256sum --check --strict
          curl --fail --silent --show-error --location \
            --output "${trivy_archive}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${trivy_archive}"
          grep "  ${trivy_archive}$" "${trivy_checksums}" | sha256sum --check --strict
          tar -xzf "${trivy_archive}" -C .release-tools trivy

      - name: Generate backend, frontend and digest-bound image SBOMs
        id: evidence
        shell: bash
        env:
          APP_IMAGE: ${{ steps.release.outputs.app_image }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          NGINX_IMAGE: ${{ steps.release.outputs.nginx_image }}
          NGINX_DIGEST: ${{ steps.nginx.outputs.digest }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          app_reference="${APP_IMAGE}@${APP_DIGEST}"
          nginx_reference="${NGINX_IMAGE}@${NGINX_DIGEST}"
          backend_jar="web-starter-admin/target/web-starter-admin-${RELEASE_VERSION}.jar"
          test -f "${backend_jar}"
          test ! -L "${backend_jar}"

          .release-tools/syft -q "file:${backend_jar}" -o cyclonedx-json=artifacts/backend.cdx.json
          .release-tools/syft -q dir:web-starter-web -o cyclonedx-json=artifacts/frontend.cdx.json
          .release-tools/syft -q "${app_reference}" -o cyclonedx-json=artifacts/app-image.cdx.json
          .release-tools/syft -q "${nginx_reference}" -o cyclonedx-json=artifacts/nginx-image.cdx.json

          jq -n \
            --arg tag "${RELEASE_TAG}" \
            --arg version "${RELEASE_VERSION}" \
            --arg commit "${GITHUB_SHA}" \
            --arg appReference "${app_reference}" \
            --arg appDigest "${APP_DIGEST}" \
            --arg nginxReference "${nginx_reference}" \
            --arg nginxDigest "${NGINX_DIGEST}" \
            '{
              schemaVersion: 1,
              releaseTag: $tag,
              releaseVersion: $version,
              gitCommit: $commit,
              sboms: {
                backend: "backend.cdx.json",
                frontend: "frontend.cdx.json"
              },
              images: [
                {
                  name: "app",
                  reference: $appReference,
                  digest: $appDigest,
                  sbom: "app-image.cdx.json",
                  vulnerabilityReport: "raw/app-vulnerabilities.json",
                  secretReport: "raw/app-secrets.json"
                },
                {
                  name: "nginx",
                  reference: $nginxReference,
                  digest: $nginxDigest,
                  sbom: "nginx-image.cdx.json",
                  vulnerabilityReport: "raw/nginx-vulnerabilities.json",
                  secretReport: "raw/nginx-secrets.json"
                }
              ]
            }' > artifacts/release-images.json

          echo "app_reference=${app_reference}" >> "${GITHUB_OUTPUT}"
          echo "nginx_reference=${nginx_reference}" >> "${GITHUB_OUTPUT}"

      - name: Scan the actual release digests
        shell: bash
        env:
          APP_REFERENCE: ${{ steps.evidence.outputs.app_reference }}
          NGINX_REFERENCE: ${{ steps.evidence.outputs.nginx_reference }}
        run: |
          test -f security/trivy-release.yaml
          test ! -L security/trivy-release.yaml
          test -s security/trivy-release.yaml
          test -f security/trivy-secret-release.yaml
          test ! -L security/trivy-secret-release.yaml
          test -s security/trivy-secret-release.yaml
          test -f security/trivy-release.ignore
          test ! -L security/trivy-release.ignore
          test ! -s security/trivy-release.ignore
          trivy_work_root="${RUNNER_TEMP}/web-starter-release-trivy"
          docker_config_dir="${DOCKER_CONFIG:-${HOME}/.docker}"
          mkdir -p "${trivy_work_root}"
          test -d "${docker_config_dir}"
          scan_release_image() {
            scanner="$1"
            reference="$2"
            output="$3"
            python3 -B scripts/release_trivy.py \
              --trivy "${GITHUB_WORKSPACE}/.release-tools/trivy" \
              --repository-root "${GITHUB_WORKSPACE}" \
              --config "${GITHUB_WORKSPACE}/security/trivy-release.yaml" \
              --secret-config "${GITHUB_WORKSPACE}/security/trivy-secret-release.yaml" \
              --ignore-file "${GITHUB_WORKSPACE}/security/trivy-release.ignore" \
              --work-root "${trivy_work_root}" \
              --docker-config "${docker_config_dir}" \
              --scanner "${scanner}" \
              --reference "${reference}" \
              --output "${GITHUB_WORKSPACE}/${output}"
          }
          scan_release_image vuln "${APP_REFERENCE}" artifacts/raw/app-vulnerabilities.json
          scan_release_image secret "${APP_REFERENCE}" artifacts/raw/app-secrets.json
          scan_release_image vuln "${NGINX_REFERENCE}" artifacts/raw/nginx-vulnerabilities.json
          scan_release_image secret "${NGINX_REFERENCE}" artifacts/raw/nginx-secrets.json

      - name: Enforce Critical, High-exception and secret policy
        run: |
          python3 -B scripts/release_security_gate.py \
            --manifest artifacts/release-images.json \
            --exceptions security/high-vulnerability-exceptions.json \
            --output artifacts/security-gate-summary.json

      - name: Write digest-bound deployment inputs
        env:
          APP_IMAGE: ${{ steps.release.outputs.app_image }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          NGINX_IMAGE: ${{ steps.release.outputs.nginx_image }}
          NGINX_DIGEST: ${{ steps.nginx.outputs.digest }}
        run: |
          printf '%s\n' \
            "WEB_STARTER_APP_IMAGE=${APP_IMAGE}" \
            "WEB_STARTER_APP_DIGEST=${APP_DIGEST}" \
            "WEB_STARTER_NGINX_IMAGE=${NGINX_IMAGE}" \
            "WEB_STARTER_NGINX_DIGEST=${NGINX_DIGEST}" \
            > artifacts/deployment-images.env

      - name: Install pinned Docker Compose serializer
        id: compose_cli
        shell: bash
        env:
          DOCKER_COMPOSE_VERSION: 5.3.1
          DOCKER_COMPOSE_LINUX_X86_64_SHA256: f9ebc6ebdb19d769b793c245a736caaeb198c62587f13b25c660c13b4987f959
        run: |
          set -euo pipefail
          install_root="$(mktemp -d "${RUNNER_TEMP}/web-starter-compose.XXXXXX")"
          binary="${install_root}/docker-compose"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --output "${binary}" \
            "https://github.com/docker/compose/releases/download/v${DOCKER_COMPOSE_VERSION}/docker-compose-linux-x86_64"
          printf '%s  %s\n' "${DOCKER_COMPOSE_LINUX_X86_64_SHA256}" "${binary}" \
            | sha256sum --check --strict -
          chmod 0755 "${binary}"
          test "$("${binary}" version --short)" = "${DOCKER_COMPOSE_VERSION}"
          printf 'binary=%s\n' "${binary}" >> "${GITHUB_OUTPUT}"

      - name: Expand and enforce the actual production Compose model
        env:
          WEB_STARTER_MYSQL_IMAGE: ${{ vars.WEB_STARTER_MYSQL_IMAGE }}
          WEB_STARTER_REDIS_IMAGE: ${{ vars.WEB_STARTER_REDIS_IMAGE }}
          WEB_STARTER_APP_IMAGE: ${{ steps.release.outputs.app_image }}
          WEB_STARTER_APP_DIGEST: ${{ steps.app.outputs.digest }}
          WEB_STARTER_NGINX_IMAGE: ${{ steps.release.outputs.nginx_image }}
          WEB_STARTER_NGINX_DIGEST: ${{ steps.nginx.outputs.digest }}
          WEB_STARTER_DB_ROOT_PASSWORD: validation-only
          WEB_STARTER_DB_USERNAME: web_starter
          WEB_STARTER_DB_PASSWORD: validation-only
          WEB_STARTER_REDIS_PASSWORD: validation-only
          WEB_STARTER_TOKEN_PEPPER: validation-only-value-that-is-long-enough
          WEB_STARTER_MANAGEMENT_USERNAME: validation_ops
          WEB_STARTER_MANAGEMENT_PASSWORD: validation-only-operations-password-0001
          WEB_STARTER_OAUTH_ISSUER: https://web-starter.example.invalid
          WEB_STARTER_OAUTH_RESOURCE_AUDIENCE: https://mcp.example.invalid/mcp
          WEB_STARTER_MCP_ALLOWED_HOSTS: web-starter.example.invalid,mcp.example.invalid
          WEB_STARTER_MCP_ALLOWED_ORIGINS: https://web-starter.example.invalid,https://mcp.example.invalid
          WEB_STARTER_HTTP_BIND_ADDRESS: 127.0.0.1
          WEB_STARTER_PUBLIC_TLS_CERT_FILE: /run/secrets/web-starter-cert.pem
          WEB_STARTER_PUBLIC_TLS_KEY_FILE: /run/secrets/web-starter-key.pem
        run: |
          "${{ steps.compose_cli.outputs.binary }}" -f compose.production.yaml config --format json > artifacts/production-compose.json
          python3 -B scripts/production_compose_policy.py \
            --compose-json artifacts/production-compose.json \
            --repository-root . \
            --output artifacts/production-compose-policy.json

      - name: Install the pinned release browser
        working-directory: web-starter-web
        run: pnpm exec playwright install --with-deps chromium

      - name: Require protected public V1 reference-repository inputs
        shell: bash
        env:
          REFERENCE_REPOSITORY: ${{ vars.WEB_STARTER_REFERENCE_REPOSITORY }}
          REFERENCE_COMMIT: ${{ vars.WEB_STARTER_REFERENCE_REPOSITORY_COMMIT }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "${REFERENCE_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "WEB_STARTER_REFERENCE_REPOSITORY must be a protected owner/repository value" >&2
            exit 1
          fi
          if [[ ! "${REFERENCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "WEB_STARTER_REFERENCE_REPOSITORY_COMMIT must be a protected full SHA-1" >&2
            exit 1
          fi
          if [[ "${REFERENCE_REPOSITORY,,}" == "${CURRENT_REPOSITORY,,}" ]]; then
            echo "V1 reference repository must be external to the release repository" >&2
            exit 1
          fi

      - name: Checkout the public V1 reference repository anonymously
        shell: bash
        env:
          REFERENCE_REPOSITORY: ${{ vars.WEB_STARTER_REFERENCE_REPOSITORY }}
          REFERENCE_COMMIT: ${{ vars.WEB_STARTER_REFERENCE_REPOSITORY_COMMIT }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /bin/false
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "0"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          reference_root="${GITHUB_WORKSPACE}/.release-reference-repository"
          if [[ -e "${reference_root}" || -L "${reference_root}" ]]; then
            echo "reference repository checkout path already exists" >&2
            exit 1
          fi

          umask 077
          metadata_file="$(mktemp "${RUNNER_TEMP}/web-starter-reference-metadata.XXXXXX")"
          trap 'rm -f "${metadata_file}"' EXIT
          curl --disable --fail --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output "${metadata_file}" \
            "https://api.github.com/repos/${REFERENCE_REPOSITORY}"
          if ! jq -e --arg repository "${REFERENCE_REPOSITORY}" '
                ((.full_name | ascii_downcase) == ($repository | ascii_downcase))
                and .private == false
                and .visibility == "public"
              ' "${metadata_file}" >/dev/null; then
            echo "V1 reference repository must be publicly visible" >&2
            exit 1
          fi

          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY \
            GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_TEMPLATE_DIR SSH_ASKPASS
          git init --quiet "${reference_root}"
          git -C "${reference_root}" remote add origin \
            "https://github.com/${REFERENCE_REPOSITORY}.git"
          git -C "${reference_root}" fetch --quiet --no-tags --depth=1 \
            origin "${REFERENCE_COMMIT}"
          git -C "${reference_root}" checkout --quiet --detach "${REFERENCE_COMMIT}"
          git -C "${reference_root}" remote remove origin
          rm -f "${metadata_file}"
          trap - EXIT

      - name: Verify the public V1 reference checkout
        shell: bash
        env:
          REFERENCE_COMMIT: ${{ vars.WEB_STARTER_REFERENCE_REPOSITORY_COMMIT }}
        run: |
          set -euo pipefail
          reference_root="${GITHUB_WORKSPACE}/.release-reference-repository"
          if [[ -L "${reference_root}" || ! -d "${reference_root}" ]]; then
            echo "reference repository checkout is not a real directory" >&2
            exit 1
          fi
          if [[ "$(git -C "${reference_root}" rev-parse --show-toplevel)" != "${reference_root}" || \
                "$(git -C "${reference_root}" rev-parse HEAD^{commit})" != "${REFERENCE_COMMIT}" ]]; then
            echo "reference repository checkout differs from the protected commit" >&2
            exit 1
          fi
          if [[ -n "$(git -C "${reference_root}" status --porcelain=v1 --untracked-files=all)" || \
                -n "$(git -C "${reference_root}" ls-files --stage | awk '$1 == "160000" {print $0}')" ]]; then
            echo "reference repository must be clean and contain no Git links" >&2
            exit 1
          fi

      - name: Prepare private recovery evidence directories
        id: recovery
        shell: bash
        env:
          GENERATOR_FORBIDDEN_TERMS_SECRET: ${{ secrets.WEB_STARTER_FORBIDDEN_TERMS }}
        run: |
          ac40_dir="${RUNNER_TEMP}/web-starter-ac40-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ac07_dir="${RUNNER_TEMP}/web-starter-ac07-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ac41_dir="${RUNNER_TEMP}/web-starter-ac41-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ac29_dir="${RUNNER_TEMP}/web-starter-ac29-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ac26_dir="${RUNNER_TEMP}/web-starter-ac26-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          v1_source_dir="${RUNNER_TEMP}/web-starter-v1-source-provenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          v1_operations_proof_dir="${RUNNER_TEMP}/web-starter-v1-ac38-operations-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          project_transport_proof_dir="${RUNNER_TEMP}/web-starter-v1-ac15-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          project_transport_summary_dir="${RUNNER_TEMP}/web-starter-v1-ac15-summary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_runtime_reports_dir="${RUNNER_TEMP}/web-starter-release-runtime-test-reports-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mcp_crud_proof_dir="${RUNNER_TEMP}/web-starter-mcp-crud-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mcp_tool_contract_proof_dir="${RUNNER_TEMP}/web-starter-mcp-tool-contract-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mcp_governance_proof_dir="${RUNNER_TEMP}/web-starter-mcp-governance-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          credential_lifecycle_dir="${RUNNER_TEMP}/web-starter-credential-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tooling_lifecycle_dir="${RUNNER_TEMP}/web-starter-tooling-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tooling_runtime_dir="${RUNNER_TEMP}/web-starter-tooling-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tooling_summary_dir="${RUNNER_TEMP}/web-starter-tooling-summary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          generator_private_root="${RUNNER_TEMP}/web-starter-generator-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          generator_acceptance_bundle="${generator_private_root}/raw-bundle"
          generator_forbidden_terms="${generator_private_root}/forbidden-terms.txt"
          generator_summary_dir="${generator_private_root}/summary"
          generator_summary="${generator_summary_dir}/v2-generator-acceptance-summary.json"
          candidate_validation_root="${RUNNER_TEMP}/web-starter-candidate-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for evidence_dir in \
            "${ac40_dir}" "${ac07_dir}" "${ac41_dir}" "${ac29_dir}" "${ac26_dir}" \
            "${v1_source_dir}" \
            "${project_transport_proof_dir}" "${project_transport_summary_dir}" \
            "${release_runtime_reports_dir}" \
            "${mcp_crud_proof_dir}" "${mcp_tool_contract_proof_dir}" \
            "${mcp_governance_proof_dir}" "${credential_lifecycle_dir}" \
            "${tooling_lifecycle_dir}" "${tooling_runtime_dir}" "${tooling_summary_dir}"; do
            if [[ -e "${evidence_dir}" || -L "${evidence_dir}" ]]; then
              echo "private recovery evidence directory already exists" >&2
              exit 1
            fi
            mkdir -m 700 "${evidence_dir}"
          done
          if [[ -e "${generator_private_root}" || -L "${generator_private_root}" ]]; then
            echo "private generator evidence root already exists" >&2
            exit 1
          fi
          mkdir -m 700 "${generator_private_root}"
          mkdir -m 700 "${generator_summary_dir}"
          if [[ -e "${generator_acceptance_bundle}" || -L "${generator_acceptance_bundle}" ]]; then
            echo "raw generator evidence destination must not exist" >&2
            exit 1
          fi
          python3 -B - \
            "${GITHUB_WORKSPACE}" \
            "${generator_private_root}" \
            "${generator_forbidden_terms}" <<'PY'
          from pathlib import Path
          import os
          import stat
          import sys

          repository = Path(sys.argv[1]).resolve(strict=True)
          private_root = Path(sys.argv[2]).resolve(strict=True)
          target = Path(sys.argv[3]).absolute()
          terms_text = os.environ.get("GENERATOR_FORBIDDEN_TERMS_SECRET", "")
          if not terms_text or not terms_text.strip():
              raise SystemExit("WEB_STARTER_FORBIDDEN_TERMS must contain at least one term")
          if any((ord(character) < 32 and character != "\n") or ord(character) == 127
                 for character in terms_text):
              raise SystemExit("WEB_STARTER_FORBIDDEN_TERMS contains a forbidden control character")
          parsed_terms = [
              line.strip() for line in terms_text.splitlines()
              if line.strip() and not line.strip().startswith("#")
          ]
          if not parsed_terms:
              raise SystemExit("WEB_STARTER_FORBIDDEN_TERMS contains no effective terms")
          payload = terms_text.encode("utf-8")
          if len(payload) > 64 * 1024:
              raise SystemExit("WEB_STARTER_FORBIDDEN_TERMS exceeds the validator bound")
          if private_root == repository or repository in private_root.parents \
                  or private_root in repository.parents:
              raise SystemExit("generator private evidence root must be outside the repository")
          if target.parent.resolve(strict=True) != private_root:
              raise SystemExit("forbidden-term destination escaped its fixed private root")
          descriptor = os.open(
              target,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
              0o600,
          )
          try:
              with os.fdopen(descriptor, "wb") as stream:
                  stream.write(payload)
                  stream.flush()
                  os.fsync(stream.fileno())
          except BaseException:
              target.unlink(missing_ok=True)
              raise
          metadata = target.lstat()
          if target.is_symlink() or not stat.S_ISREG(metadata.st_mode) \
                  or stat.S_IMODE(metadata.st_mode) != 0o600 \
                  or target.stat().st_size == 0:
              target.unlink(missing_ok=True)
              raise SystemExit("forbidden-term file is not a non-empty regular mode 0600 file")
          PY
          if [[ -e "${candidate_validation_root}" || -L "${candidate_validation_root}" ]]; then
            echo "candidate validation worktree already exists" >&2
            exit 1
          fi
          git -c core.hooksPath=/dev/null worktree add --detach \
            "${candidate_validation_root}" "${GITHUB_SHA}"
          chmod 700 "${candidate_validation_root}"
          (
            cd "${candidate_validation_root}/web-starter-web"
            pnpm install --frozen-lockfile --offline
          )
          if [[ "$(git -C "${candidate_validation_root}" rev-parse HEAD^{commit})" != "${GITHUB_SHA}" ]]; then
            echo "candidate validation worktree differs from the release commit" >&2
            exit 1
          fi
          if [[ "$(git -C "${candidate_validation_root}" rev-parse "refs/tags/${{ steps.release.outputs.release_tag }}^{commit}")" != "${GITHUB_SHA}" ]]; then
            echo "candidate validation worktree tag differs from the release commit" >&2
            exit 1
          fi
          if [[ -n "$(git -C "${candidate_validation_root}" status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "candidate validation worktree is not clean" >&2
            exit 1
          fi
          if [[ "$("${candidate_validation_root}/web-starter-web/node_modules/.bin/playwright" --version)" != "Version 1.61.1" ]]; then
            echo "candidate validation worktree lacks local Playwright 1.61.1" >&2
            exit 1
          fi
          {
            printf 'ac40_dir=%s\n' "${ac40_dir}"
            printf 'ac40_evidence=%s/v2-v1-upgrade-rehearsal.json\n' "${ac40_dir}"
            printf 'ac07_dir=%s\n' "${ac07_dir}"
            printf 'ac07_evidence=%s/v2-ac07-migration-failure.json\n' "${ac07_dir}"
            printf 'ac41_dir=%s\n' "${ac41_dir}"
            printf 'ac41_evidence=%s/v2-ac41-redis-loss.json\n' "${ac41_dir}"
            printf 'ac29_dir=%s\n' "${ac29_dir}"
            printf 'ac29_evidence=%s/v2-ac29-production-fail-fast.json\n' "${ac29_dir}"
            printf 'ac26_dir=%s\n' "${ac26_dir}"
            printf 'ac26_evidence=%s/v2-ac26-jwks-rotation.json\n' "${ac26_dir}"
            printf 'v1_source_dir=%s\n' "${v1_source_dir}"
            printf 'v1_source_evidence=%s/v2-ac01-v1-source-provenance.json\n' \
              "${v1_source_dir}"
            printf 'v1_operations_proof_dir=%s\n' "${v1_operations_proof_dir}"
            printf 'v1_operations_proof=%s/v1-ac38-operations-documentation-proof.json\n' \
              "${v1_operations_proof_dir}"
            printf 'project_transport_proof_dir=%s\n' "${project_transport_proof_dir}"
            printf 'project_transport_proof=%s/project-transport-parity-proof.properties\n' \
              "${project_transport_proof_dir}"
            printf 'project_transport_summary_dir=%s\n' "${project_transport_summary_dir}"
            printf 'project_transport_summary=%s/project-transport-parity-proof-summary.json\n' \
              "${project_transport_summary_dir}"
            printf 'release_runtime_test_reports_dir=%s\n' \
              "${release_runtime_reports_dir}"
            printf 'mcp_crud_proof_dir=%s\n' "${mcp_crud_proof_dir}"
            printf 'mcp_crud_proof=%s/mcp-crud-runtime-proof.properties\n' \
              "${mcp_crud_proof_dir}"
            printf 'mcp_tool_contract_proof_dir=%s\n' \
              "${mcp_tool_contract_proof_dir}"
            printf 'mcp_tool_contract_proof=%s/mcp-tool-contract-runtime-proof.properties\n' \
              "${mcp_tool_contract_proof_dir}"
            printf 'mcp_governance_proof_dir=%s\n' "${mcp_governance_proof_dir}"
            printf 'mcp_governance_proof=%s/mcp-governance-runtime-proof.properties\n' \
              "${mcp_governance_proof_dir}"
            printf 'credential_lifecycle_dir=%s\n' "${credential_lifecycle_dir}"
            printf 'credential_lifecycle_report=%s/v2-credential-lifecycle-runtime.json\n' \
              "${credential_lifecycle_dir}"
            printf 'tooling_lifecycle_dir=%s\n' "${tooling_lifecycle_dir}"
            printf 'tooling_lifecycle_report=%s/v2-tooling-lifecycle-runtime.json\n' \
              "${tooling_lifecycle_dir}"
            printf 'tooling_runtime_dir=%s\n' "${tooling_runtime_dir}"
            printf 'tooling_summary_dir=%s\n' "${tooling_summary_dir}"
            printf 'tooling_summary=%s/v2-tooling-lifecycle-runtime-summary.json\n' \
              "${tooling_summary_dir}"
            printf 'generator_acceptance_bundle=%s\n' "${generator_acceptance_bundle}"
            printf 'generator_forbidden_terms=%s\n' "${generator_forbidden_terms}"
            printf 'generator_summary_dir=%s\n' "${generator_summary_dir}"
            printf 'generator_summary=%s\n' "${generator_summary}"
            printf 'candidate_validation_root=%s\n' "${candidate_validation_root}"
          } >> "${GITHUB_OUTPUT}"

      - name: Produce and independently validate frozen V1 source provenance
        shell: bash
        env:
          CANDIDATE_VALIDATION_ROOT: ${{ steps.recovery.outputs.candidate_validation_root }}
          V1_SOURCE_DIR: ${{ steps.recovery.outputs.v1_source_dir }}
          V1_SOURCE_EVIDENCE: ${{ steps.recovery.outputs.v1_source_evidence }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ -e artifacts/acceptance ]]; then
            test -d artifacts/acceptance
            test ! -L artifacts/acceptance
            chmod 700 artifacts/acceptance
          else
            mkdir -m 700 artifacts/acceptance
          fi
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/create_v1_source_provenance_proof.py" \
            --repository-root "${CANDIDATE_VALIDATION_ROOT}" \
            --expected-candidate-commit "${GITHUB_SHA}" \
            --expected-candidate-version "${RELEASE_VERSION}" \
            --expected-candidate-tag "${RELEASE_TAG}" \
            --output-dir "${V1_SOURCE_DIR}"
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/validate_v1_source_provenance_proof.py" \
            --repository-root "${CANDIDATE_VALIDATION_ROOT}" \
            --evidence "${V1_SOURCE_EVIDENCE}" \
            --expected-candidate-commit "${GITHUB_SHA}" \
            --expected-candidate-version "${RELEASE_VERSION}" \
            --expected-candidate-tag "${RELEASE_TAG}" \
            --summary-output artifacts/acceptance/v2-ac01-v1-source-provenance-summary.json
          python3 -B - \
            "${V1_SOURCE_DIR}" \
            artifacts/acceptance/v2-ac01-v1-source-provenance-summary.json <<'PY'
          from pathlib import Path
          import stat
          import sys

          raw = Path(sys.argv[1]).absolute()
          summary = Path(sys.argv[2]).absolute()
          if raw.is_symlink() or not raw.is_dir() \
                  or stat.S_IMODE(raw.lstat().st_mode) != 0o700:
              raise SystemExit("V1 source provenance raw directory is not real mode 0700")
          expected = {
              "v2-ac01-v1-source-provenance.json",
              "v2-ac01-v1-source-provenance.json.sha256",
          }
          entries = {entry.name for entry in raw.iterdir()}
          if entries != expected:
              raise SystemExit("V1 source provenance raw directory is not exact")
          for entry in raw.iterdir():
              metadata = entry.lstat()
              if entry.is_symlink() or not stat.S_ISREG(metadata.st_mode) \
                      or stat.S_IMODE(metadata.st_mode) != 0o600:
                  raise SystemExit("V1 source provenance raw file is not regular mode 0600")
          metadata = summary.lstat()
          if summary.name != "v2-ac01-v1-source-provenance-summary.json" \
                  or summary.is_symlink() or not stat.S_ISREG(metadata.st_mode) \
                  or stat.S_IMODE(metadata.st_mode) != 0o600:
              raise SystemExit("V1 source provenance summary is not canonical mode 0600")
          PY

      - name: Produce and independently validate V1 AC-38 operations documentation
        shell: bash
        env:
          CANDIDATE_VALIDATION_ROOT: ${{ steps.recovery.outputs.candidate_validation_root }}
          V1_OPERATIONS_PROOF_DIR: ${{ steps.recovery.outputs.v1_operations_proof_dir }}
          V1_OPERATIONS_PROOF: ${{ steps.recovery.outputs.v1_operations_proof }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/create_v1_operations_documentation_proof.py" \
            --repository-root "${CANDIDATE_VALIDATION_ROOT}" \
            --output-directory "${V1_OPERATIONS_PROOF_DIR}" \
            --expected-candidate-commit "${GITHUB_SHA}" \
            --expected-candidate-tag "${RELEASE_TAG}" \
            --expected-candidate-version "${RELEASE_VERSION}"
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/validate_v1_operations_documentation_proof.py" \
            --proof "${V1_OPERATIONS_PROOF}" \
            --repository-root "${CANDIDATE_VALIDATION_ROOT}" \
            --expected-candidate-commit "${GITHUB_SHA}" \
            --expected-candidate-tag "${RELEASE_TAG}" \
            --expected-candidate-version "${RELEASE_VERSION}" \
            --summary-output artifacts/acceptance/v1-ac38-operations-documentation-summary.json

      - name: Independently evaluate V1 AC-40 project isolation
        shell: bash
        env:
          CANDIDATE_VALIDATION_ROOT: ${{ steps.recovery.outputs.candidate_validation_root }}
          FORBIDDEN_TERMS: ${{ steps.recovery.outputs.generator_forbidden_terms }}
          REFERENCE_REPOSITORY: ${{ github.workspace }}/.release-reference-repository
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/validate_v1_project_isolation_evidence.py" \
            --repository-root "${CANDIDATE_VALIDATION_ROOT}" \
            --forbidden-terms "${FORBIDDEN_TERMS}" \
            --reference-repository "${REFERENCE_REPOSITORY}" \
            --expected-candidate-commit "${GITHUB_SHA}" \
            --expected-candidate-tag "${RELEASE_TAG}" \
            --expected-candidate-version "${RELEASE_VERSION}" \
            --summary-output artifacts/acceptance/v1-ac40-project-isolation-summary.json

      - name: Produce and independently validate V1 AC-15 transport parity
        shell: bash
        env:
          CANDIDATE_VALIDATION_ROOT: ${{ steps.recovery.outputs.candidate_validation_root }}
          PROJECT_TRANSPORT_PROOF_DIR: ${{ steps.recovery.outputs.project_transport_proof_dir }}
          PROJECT_TRANSPORT_PROOF: ${{ steps.recovery.outputs.project_transport_proof }}
          PROJECT_TRANSPORT_SUMMARY_DIR: ${{ steps.recovery.outputs.project_transport_summary_dir }}
          PROJECT_TRANSPORT_SUMMARY: ${{ steps.recovery.outputs.project_transport_summary }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          started_at_epoch_ns="$(python3 -c 'import time; print(time.time_ns())')"
          (
            cd "${CANDIDATE_VALIDATION_ROOT}"
            ./mvnw -B -ntp -pl web-starter-admin -am \
              -Dtest=dev.webstarter.admin.acceptance.ProjectTransportParityIT#provesRestAndMcpShareProjectServiceWithoutProjectPersistenceDependency \
              -Dsurefire.failIfNoSpecifiedTests=false \
              -Dsurefire.useFile=false \
              -Dweb-starter.admin.surefire-reports-directory="${PROJECT_TRANSPORT_PROOF_DIR}" \
              test
          )
          report="${PROJECT_TRANSPORT_PROOF_DIR}/TEST-dev.webstarter.admin.acceptance.ProjectTransportParityIT.xml"
          chmod 600 "${report}"
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/create_project_transport_parity_proof.py" \
            --repository-root "${CANDIDATE_VALIDATION_ROOT}" \
            --report "${report}" \
            --output "${PROJECT_TRANSPORT_PROOF}" \
            --candidate-commit "${GITHUB_SHA}" \
            --candidate-version "${RELEASE_VERSION}" \
            --candidate-tag "${RELEASE_TAG}" \
            --started-at-epoch-ns "${started_at_epoch_ns}"
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/validate_project_transport_parity_proof.py" \
            --proof "${PROJECT_TRANSPORT_PROOF}" \
            --repository-root "${CANDIDATE_VALIDATION_ROOT}" \
            --expected-candidate-commit "${GITHUB_SHA}" \
            --expected-candidate-version "${RELEASE_VERSION}" \
            --expected-candidate-tag "${RELEASE_TAG}" \
            --require-pass \
            --summary-output "${PROJECT_TRANSPORT_SUMMARY_DIR}"
          python3 -B - \
            "${PROJECT_TRANSPORT_SUMMARY}" \
            artifacts/acceptance/v1-ac15-project-transport-parity-summary.json <<'PY'
          from pathlib import Path
          import os
          import stat
          import sys

          source = Path(sys.argv[1]).absolute()
          target = Path(sys.argv[2]).absolute()
          source_metadata = source.lstat()
          if source.is_symlink() or not stat.S_ISREG(source_metadata.st_mode) \
                  or stat.S_IMODE(source_metadata.st_mode) != 0o600:
              raise SystemExit("V1 AC-15 private summary is not regular mode 0600")
          payload = source.read_bytes()
          descriptor = os.open(
              target,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
              0o600,
          )
          try:
              with os.fdopen(descriptor, "wb") as stream:
                  stream.write(payload)
                  stream.flush()
                  os.fsync(stream.fileno())
          except BaseException:
              target.unlink(missing_ok=True)
              raise
          target_metadata = target.lstat()
          if target.is_symlink() or not stat.S_ISREG(target_metadata.st_mode) \
                  or stat.S_IMODE(target_metadata.st_mode) != 0o600 \
                  or target.read_bytes() != payload or source.read_bytes() != payload:
              target.unlink(missing_ok=True)
              raise SystemExit("V1 AC-15 public summary copy is not exact")
          PY

      - name: Rehearse and independently validate generated project and module acceptance
        shell: bash
        env:
          CANDIDATE_VALIDATION_ROOT: ${{ steps.recovery.outputs.candidate_validation_root }}
          GENERATOR_ACCEPTANCE_BUNDLE: ${{ steps.recovery.outputs.generator_acceptance_bundle }}
          GENERATOR_FORBIDDEN_TERMS: ${{ steps.recovery.outputs.generator_forbidden_terms }}
          GENERATOR_SUMMARY_DIR: ${{ steps.recovery.outputs.generator_summary_dir }}
          GENERATOR_SUMMARY: ${{ steps.recovery.outputs.generator_summary }}
          MYSQL_REFERENCE: ${{ vars.WEB_STARTER_MYSQL_IMAGE }}
          REDIS_REFERENCE: ${{ vars.WEB_STARTER_REDIS_IMAGE }}
          REGISTRY_REFERENCE: ${{ vars.WEB_STARTER_REGISTRY_IMAGE }}
        run: |
          for reference in "${MYSQL_REFERENCE}" "${REDIS_REFERENCE}" "${REGISTRY_REFERENCE}"; do
            if [[ ! "${reference}" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
              echo "generator acceptance images must be immutable digest references" >&2
              exit 1
            fi
            docker pull "${reference}"
          done
          if [[ -e "${GENERATOR_ACCEPTANCE_BUNDLE}" || -L "${GENERATOR_ACCEPTANCE_BUNDLE}" ]]; then
            echo "raw generator evidence destination appeared before producer execution" >&2
            exit 1
          fi
          python3 -B - "${GENERATOR_SUMMARY_DIR}" <<'PY'
          from pathlib import Path
          import stat
          import sys

          directory = Path(sys.argv[1]).absolute()
          metadata = directory.lstat()
          if directory.is_symlink() or not stat.S_ISDIR(metadata.st_mode) \
                  or stat.S_IMODE(metadata.st_mode) != 0o700 or any(directory.iterdir()):
              raise SystemExit("generator summary directory must be a real empty mode 0700 directory")
          PY
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/rehearse_generator_acceptance.py" \
            --repository "${CANDIDATE_VALIDATION_ROOT}" \
            --output "${GENERATOR_ACCEPTANCE_BUNDLE}" \
            --forbidden-terms "${GENERATOR_FORBIDDEN_TERMS}" \
            --mysql-image "${MYSQL_REFERENCE}" \
            --redis-image "${REDIS_REFERENCE}" \
            --registry-image "${REGISTRY_REFERENCE}"
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/validate_generator_acceptance_evidence.py" \
            --evidence-directory "${GENERATOR_ACCEPTANCE_BUNDLE}" \
            --repository-root "${CANDIDATE_VALIDATION_ROOT}" \
            --forbidden-terms "${GENERATOR_FORBIDDEN_TERMS}" \
            --require-pass \
            --summary-output "${GENERATOR_SUMMARY_DIR}"
          if [[ -e artifacts/acceptance ]]; then
            test -d artifacts/acceptance
            test ! -L artifacts/acceptance
          else
            mkdir -m 700 artifacts/acceptance
          fi
          python3 -B - \
            "${GENERATOR_SUMMARY_DIR}" \
            "${GENERATOR_SUMMARY}" \
            artifacts/acceptance/v2-generator-acceptance-summary.json <<'PY'
          from pathlib import Path
          import os
          import stat
          import sys

          source_parent = Path(sys.argv[1]).absolute()
          source = Path(sys.argv[2]).absolute()
          target = Path(sys.argv[3]).absolute()
          parent_metadata = source_parent.lstat()
          source_metadata = source.lstat()
          target_parent_metadata = target.parent.lstat()
          if source_parent.is_symlink() or not stat.S_ISDIR(parent_metadata.st_mode) \
                  or stat.S_IMODE(parent_metadata.st_mode) != 0o700 \
                  or {entry.name for entry in source_parent.iterdir()} != {source.name}:
              raise SystemExit("generator private summary directory is not exact")
          if source.is_symlink() or not stat.S_ISREG(source_metadata.st_mode) \
                  or stat.S_IMODE(source_metadata.st_mode) != 0o600:
              raise SystemExit("generator private summary must be a regular mode 0600 file")
          if target.parent.is_symlink() or not stat.S_ISDIR(target_parent_metadata.st_mode) \
                  or stat.S_IMODE(target_parent_metadata.st_mode) != 0o700:
              raise SystemExit("generator public summary parent must be a real mode 0700 directory")
          before = (
              source_metadata.st_dev,
              source_metadata.st_ino,
              source_metadata.st_size,
              source_metadata.st_mtime_ns,
              stat.S_IMODE(source_metadata.st_mode),
          )
          payload = source.read_bytes()
          descriptor = os.open(
              target,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
              0o600,
          )
          try:
              with os.fdopen(descriptor, "wb") as stream:
                  stream.write(payload)
                  stream.flush()
                  os.fsync(stream.fileno())
          except BaseException:
              target.unlink(missing_ok=True)
              raise
          current_metadata = source.lstat()
          current = (
              current_metadata.st_dev,
              current_metadata.st_ino,
              current_metadata.st_size,
              current_metadata.st_mtime_ns,
              stat.S_IMODE(current_metadata.st_mode),
          )
          target_metadata = target.lstat()
          if current != before or source.read_bytes() != payload \
                  or target.is_symlink() or not stat.S_ISREG(target_metadata.st_mode) \
                  or stat.S_IMODE(target_metadata.st_mode) != 0o600 \
                  or target.read_bytes() != payload:
              target.unlink(missing_ok=True)
              raise SystemExit("generator public canonical summary copy is not exact")
          PY

      - name: Download immutable Linux x86_64 AC40 dependency seed artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.release_environment.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release_environment.outputs.artifact_run_id }}
          path: ${{ steps.release_environment.outputs.download_root }}
          skip-decompress: true
          digest-mismatch: error

      - name: Verify and materialize private Linux x86_64 AC40 dependency seed
        id: ac40_seed
        shell: bash
        env:
          AC40_SEED_DOWNLOAD_ROOT: ${{ steps.release_environment.outputs.download_root }}
          AC40_SEED_PARENT: ${{ steps.release_environment.outputs.seed_parent }}
          AC40_SEED_RECEIPT_ROOT: ${{ steps.release_environment.outputs.receipt_root }}
          AC40_SEED_ARCHIVE_SHA256: ${{ steps.release_environment.outputs.archive_sha256 }}
          AC40_SEED_SHA256: ${{ steps.release_environment.outputs.seed_sha256 }}
          AC40_SEED_ARTIFACT_ID: ${{ steps.release_environment.outputs.artifact_id }}
          AC40_SEED_ARTIFACT_RUN_ID: ${{ steps.release_environment.outputs.artifact_run_id }}
          AC40_SEED_PRODUCER_SHA: ${{ steps.release_environment.outputs.producer_sha }}
          AC40_SEED_HEAD_REPOSITORY_ID: ${{ steps.release_environment.outputs.head_repository_id }}
          CANDIDATE_VALIDATION_ROOT: ${{ steps.recovery.outputs.candidate_validation_root }}
        run: |
          set -euo pipefail
          archive="${AC40_SEED_DOWNLOAD_ROOT}/web-starter-ac40-dependency-seed-linux-x86_64.tar"
          private_receipt="${AC40_SEED_RECEIPT_ROOT}/extract-receipt.json"
          public_receipt="artifacts/acceptance/v2-ac40-dependency-seed-provenance.json"

          python3 -B - \
            "${AC40_SEED_DOWNLOAD_ROOT}" \
            "${archive}" \
            "${AC40_SEED_ARCHIVE_SHA256}" <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import stat
          import sys

          download_root = Path(sys.argv[1]).absolute()
          archive = Path(sys.argv[2]).absolute()
          expected_sha256 = sys.argv[3]
          root_metadata = download_root.lstat()
          if download_root.is_symlink() or not stat.S_ISDIR(root_metadata.st_mode) \
                  or root_metadata.st_uid != os.getuid() \
                  or stat.S_IMODE(root_metadata.st_mode) != 0o700:
              raise SystemExit("AC40 artifact download root is not a caller-owned mode-0700 directory")
          if {entry.name for entry in download_root.iterdir()} != {archive.name}:
              raise SystemExit("AC40 artifact download must contain exactly the expected raw tar")
          metadata = archive.lstat()
          if archive.is_symlink() or not stat.S_ISREG(metadata.st_mode) \
                  or metadata.st_uid != os.getuid() or metadata.st_nlink != 1:
              raise SystemExit("AC40 dependency seed archive is not one caller-owned regular file")
          digest = hashlib.sha256()
          with archive.open("rb") as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(block)
          if digest.hexdigest() != expected_sha256:
              raise SystemExit("AC40 dependency seed archive does not match its Environment SHA-256")
          os.chmod(archive, 0o600, follow_symlinks=False)
          after = archive.lstat()
          if stat.S_IMODE(after.st_mode) != 0o600 or after.st_nlink != 1:
              raise SystemExit("AC40 dependency seed archive cannot be made private")
          PY

          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/build_v1_upgrade_dependency_seed.py" \
            extract-verify \
            --repository-root "${CANDIDATE_VALIDATION_ROOT}" \
            --archive "${archive}" \
            --expected-archive-sha256 "${AC40_SEED_ARCHIVE_SHA256}" \
            --expected-aggregate-sha256 "${AC40_SEED_SHA256}" \
            --seed-output "${AC40_SEED_PARENT}" \
            --receipt-output "${private_receipt}" >/dev/null

          if [[ -e artifacts/acceptance ]]; then
            test -d artifacts/acceptance
            test ! -L artifacts/acceptance
          else
            mkdir -m 700 artifacts/acceptance
          fi
          python3 -B - \
            "${private_receipt}" \
            "${public_receipt}" \
            "${AC40_SEED_ARTIFACT_ID}" \
            "${AC40_SEED_ARTIFACT_RUN_ID}" \
            "${AC40_SEED_PRODUCER_SHA}" \
            "${AC40_SEED_HEAD_REPOSITORY_ID}" \
            "${AC40_SEED_ARCHIVE_SHA256}" \
            "${AC40_SEED_SHA256}" <<'PY'
          from pathlib import Path
          import json
          import os
          import stat
          import sys

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          metadata = source.lstat()
          if source.is_symlink() or not stat.S_ISREG(metadata.st_mode) \
                  or metadata.st_uid != os.getuid() or metadata.st_nlink != 1 \
                  or stat.S_IMODE(metadata.st_mode) != 0o600:
              raise SystemExit("AC40 builder receipt is not a private regular file")
          receipt = json.loads(source.read_text(encoding="utf-8"))
          expected_keys = {
              "aggregateSha256", "architecture", "archiveSha256", "kind",
              "manifestSha256", "platform", "schemaVersion",
          }
          if set(receipt) != expected_keys \
                  or receipt["kind"] != "web-starter-ac40-dependency-seed-archive" \
                  or receipt["schemaVersion"] != 1 \
                  or receipt["archiveSha256"] != sys.argv[7] \
                  or receipt["aggregateSha256"] != sys.argv[8] \
                  or receipt["platform"] != "linux" \
                  or receipt["architecture"] != "x86_64":
              raise SystemExit("AC40 builder receipt does not match the protected Linux/x86_64 seed")
          public = {
              "schemaVersion": 1,
              "kind": "web-starter-ac40-dependency-seed-provenance",
              "environment": "release",
              "artifactId": int(sys.argv[3]),
              "workflowRunId": int(sys.argv[4]),
              "headRepositoryId": int(sys.argv[6]),
              "producerHeadSha": sys.argv[5],
              "archiveSha256": receipt["archiveSha256"],
              "aggregateSha256": receipt["aggregateSha256"],
              "manifestSha256": receipt["manifestSha256"],
              "platform": receipt["platform"],
              "architecture": receipt["architecture"],
          }
          payload = (
              json.dumps(public, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              + "\n"
          ).encode("utf-8")
          descriptor = os.open(
              target,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
              0o600,
          )
          try:
              with os.fdopen(descriptor, "wb") as stream:
                  stream.write(payload)
                  stream.flush()
                  os.fsync(stream.fileno())
          except BaseException:
              target.unlink(missing_ok=True)
              raise
          observed = target.lstat()
          if not stat.S_ISREG(observed.st_mode) or observed.st_nlink != 1 \
                  or stat.S_IMODE(observed.st_mode) != 0o600 \
                  or target.read_bytes() != payload:
              target.unlink(missing_ok=True)
              raise SystemExit("AC40 public provenance receipt is not canonical and private")
          PY

          seed_path="${AC40_SEED_PARENT}"
          test -d "${seed_path}"
          test ! -L "${seed_path}"
          echo "path=${seed_path}" >> "${GITHUB_OUTPUT}"
          echo "provenance_receipt=${public_receipt}" >> "${GITHUB_OUTPUT}"

      - name: Rehearse and independently validate V1 to V2 recovery
        shell: bash
        env:
          AC40_DIR: ${{ steps.recovery.outputs.ac40_dir }}
          AC40_EVIDENCE: ${{ steps.recovery.outputs.ac40_evidence }}
          AC40_SEED_PROVENANCE: ${{ steps.ac40_seed.outputs.provenance_receipt }}
          CANDIDATE_VALIDATION_ROOT: ${{ steps.recovery.outputs.candidate_validation_root }}
          AC40_DEPENDENCY_SEED: ${{ steps.ac40_seed.outputs.path }}
          AC40_DEPENDENCY_SEED_SHA256: ${{ steps.release_environment.outputs.seed_sha256 }}
          MYSQL_REFERENCE: ${{ vars.WEB_STARTER_MYSQL_IMAGE }}
          REDIS_REFERENCE: ${{ vars.WEB_STARTER_REDIS_IMAGE }}
        run: |
          docker pull "${MYSQL_REFERENCE}"
          docker pull "${REDIS_REFERENCE}"
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/rehearse_v1_to_v2_upgrade.py" \
            --output-dir "${AC40_DIR}" \
            --dependency-seed "${AC40_DEPENDENCY_SEED}" \
            --expected-dependency-seed-sha256 "${AC40_DEPENDENCY_SEED_SHA256}" \
            --mysql-image "${MYSQL_REFERENCE}" \
            --redis-image "${REDIS_REFERENCE}"
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/validate_v1_upgrade_evidence.py" \
            --document "${AC40_EVIDENCE}" \
            --repository-root "${CANDIDATE_VALIDATION_ROOT}" \
            --dependency-seed "${AC40_DEPENDENCY_SEED}" \
            --expected-dependency-seed-sha256 "${AC40_DEPENDENCY_SEED_SHA256}" \
            --require-pass
          if [[ -e artifacts/acceptance ]]; then
            test -d artifacts/acceptance
            test ! -L artifacts/acceptance
          else
            mkdir -m 700 artifacts/acceptance
          fi
          python3 -B - \
            "${AC40_EVIDENCE}" \
            artifacts/acceptance/v2-v1-upgrade-rehearsal.json <<'PY'
          from pathlib import Path
          import os
          import stat
          import sys

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          metadata = source.lstat()
          if source.is_symlink() or not stat.S_ISREG(metadata.st_mode) \
                  or stat.S_IMODE(metadata.st_mode) != 0o600:
              raise SystemExit("AC-40 original evidence must be a regular mode 0600 file")
          payload = source.read_bytes()
          descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          try:
              with os.fdopen(descriptor, "wb") as stream:
                  stream.write(payload)
                  stream.flush()
                  os.fsync(stream.fileno())
          except BaseException:
              target.unlink(missing_ok=True)
              raise
          if target.read_bytes() != payload or stat.S_IMODE(target.stat().st_mode) != 0o600:
              target.unlink(missing_ok=True)
              raise SystemExit("AC-40 public evidence copy is not exact and private")
          PY
          cmp -s "${AC40_EVIDENCE}" artifacts/acceptance/v2-v1-upgrade-rehearsal.json

      - name: Rehearse and independently validate migration failure protection
        shell: bash
        env:
          AC40_EVIDENCE: ${{ steps.recovery.outputs.ac40_evidence }}
          AC40_DEPENDENCY_SEED: ${{ steps.ac40_seed.outputs.path }}
          AC40_DEPENDENCY_SEED_SHA256: ${{ steps.release_environment.outputs.seed_sha256 }}
          AC07_DIR: ${{ steps.recovery.outputs.ac07_dir }}
          AC07_EVIDENCE: ${{ steps.recovery.outputs.ac07_evidence }}
          CANDIDATE_VALIDATION_ROOT: ${{ steps.recovery.outputs.candidate_validation_root }}
          APP_REFERENCE: ${{ steps.evidence.outputs.app_reference }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          MYSQL_REFERENCE: ${{ vars.WEB_STARTER_MYSQL_IMAGE }}
          REDIS_REFERENCE: ${{ vars.WEB_STARTER_REDIS_IMAGE }}
        run: |
          docker pull "${APP_REFERENCE}"
          app_image_id="$(docker image inspect --format '{{.Id}}' "${APP_REFERENCE}")"
          mysql_image_id="$(docker image inspect --format '{{.Id}}' "${MYSQL_REFERENCE}")"
          redis_image_id="$(docker image inspect --format '{{.Id}}' "${REDIS_REFERENCE}")"
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/rehearse_migration_failure.py" \
            --app-image "${APP_REFERENCE}" \
            --mysql-image "${MYSQL_REFERENCE}" \
            --redis-image "${REDIS_REFERENCE}" \
            --output-dir "${AC07_DIR}" \
            --ac40-evidence "${AC40_EVIDENCE}" \
            --ac40-dependency-seed "${AC40_DEPENDENCY_SEED}" \
            --expected-ac40-dependency-seed-sha256 "${AC40_DEPENDENCY_SEED_SHA256}"
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/validate_migration_failure_evidence.py" \
            --document "${AC07_EVIDENCE}" \
            --repository-root "${CANDIDATE_VALIDATION_ROOT}" \
            --ac40-evidence "${AC40_EVIDENCE}" \
            --ac40-dependency-seed "${AC40_DEPENDENCY_SEED}" \
            --expected-ac40-dependency-seed-sha256 "${AC40_DEPENDENCY_SEED_SHA256}" \
            --expected-app-image-id "${app_image_id}" \
            --expected-mysql-image-id "${mysql_image_id}" \
            --expected-redis-image-id "${redis_image_id}" \
            --expected-app-digest "${APP_DIGEST}" \
            --expected-app-reference "${APP_REFERENCE}" \
            --require-pass
          if [[ -e artifacts/acceptance ]]; then
            test -d artifacts/acceptance
            test ! -L artifacts/acceptance
          else
            mkdir -m 700 artifacts/acceptance
          fi
          python3 -B - \
            artifacts \
            "${AC07_EVIDENCE}" \
            "${AC07_EVIDENCE}.sha256" \
            artifacts/acceptance/v2-ac07-migration-failure.json \
            artifacts/acceptance/v2-ac07-migration-failure.json.sha256 <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import stat
          import sys

          artifact_root = Path(sys.argv[1]).resolve(strict=True)
          sources = (Path(sys.argv[2]), Path(sys.argv[3]))
          targets = (Path(sys.argv[4]), Path(sys.argv[5]))
          raw_parent = sources[0].parent
          if sources[1].parent != raw_parent:
              raise SystemExit("AC-07 raw report and checksum must be siblings")
          parent_metadata = raw_parent.lstat()
          if raw_parent.is_symlink() or not stat.S_ISDIR(parent_metadata.st_mode) \
                  or stat.S_IMODE(parent_metadata.st_mode) != 0o700:
              raise SystemExit("AC-07 raw evidence parent must be a real mode 0700 directory")
          if {entry.name for entry in raw_parent.iterdir()} != {source.name for source in sources}:
              raise SystemExit("AC-07 raw evidence directory must contain exactly report and checksum")

          source_metadata = {}
          source_bytes = {}
          for source in sources:
              metadata = source.lstat()
              if source.is_symlink() or not stat.S_ISREG(metadata.st_mode) \
                      or stat.S_IMODE(metadata.st_mode) != 0o600:
                  raise SystemExit("AC-07 raw evidence files must be regular mode 0600 files")
              source_metadata[source] = (
                  metadata.st_dev, metadata.st_ino, metadata.st_size,
                  metadata.st_mtime_ns, stat.S_IMODE(metadata.st_mode),
              )
              source_bytes[source] = source.read_bytes()
          digest = hashlib.sha256(source_bytes[sources[0]]).hexdigest()
          if source_bytes[sources[1]] != f"{digest}  {sources[0].name}\n".encode("ascii"):
              raise SystemExit("AC-07 raw checksum does not bind the report bytes")

          public_parent = targets[0].parent
          if targets[1].parent != public_parent:
              raise SystemExit("AC-07 public report and checksum must be siblings")
          public_metadata = public_parent.lstat()
          if public_parent.is_symlink() or not stat.S_ISDIR(public_metadata.st_mode) \
                  or stat.S_IMODE(public_metadata.st_mode) != 0o700 \
                  or public_parent.resolve(strict=True).parent != artifact_root:
              raise SystemExit("AC-07 public acceptance artifact directory is unsafe")
          created = []
          try:
              for source, target in zip(sources, targets, strict=True):
                  descriptor = os.open(
                      target,
                      os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
                      0o600,
                  )
                  created.append(target)
                  with os.fdopen(descriptor, "wb") as stream:
                      stream.write(source_bytes[source])
                      stream.flush()
                      os.fsync(stream.fileno())
                  target_metadata = target.lstat()
                  if target.is_symlink() or not stat.S_ISREG(target_metadata.st_mode) \
                          or stat.S_IMODE(target_metadata.st_mode) != 0o600 \
                          or target.read_bytes() != source_bytes[source]:
                      raise SystemExit("public AC-07 evidence copy is not exact and private")
              for source in sources:
                  metadata = source.lstat()
                  current = (
                      metadata.st_dev, metadata.st_ino, metadata.st_size,
                      metadata.st_mtime_ns, stat.S_IMODE(metadata.st_mode),
                  )
                  if current != source_metadata[source] \
                          or source.read_bytes() != source_bytes[source]:
                      raise SystemExit("AC-07 raw evidence changed while creating public copies")
          except BaseException:
              for target in created:
                  target.unlink(missing_ok=True)
              raise
          PY
          cmp -s "${AC07_EVIDENCE}" artifacts/acceptance/v2-ac07-migration-failure.json
          cmp -s "${AC07_EVIDENCE}.sha256" \
            artifacts/acceptance/v2-ac07-migration-failure.json.sha256

      - name: Rehearse doctor and safe development-stack lifecycle
        shell: bash
        env:
          CANDIDATE_VALIDATION_ROOT: ${{ steps.recovery.outputs.candidate_validation_root }}
          TOOLING_LIFECYCLE_DIR: ${{ steps.recovery.outputs.tooling_lifecycle_dir }}
          TOOLING_RUNTIME_DIR: ${{ steps.recovery.outputs.tooling_runtime_dir }}
          APP_REFERENCE: ${{ steps.evidence.outputs.app_reference }}
          NGINX_REFERENCE: ${{ steps.evidence.outputs.nginx_reference }}
          MYSQL_REFERENCE: ${{ vars.WEB_STARTER_MYSQL_IMAGE }}
          REDIS_REFERENCE: ${{ vars.WEB_STARTER_REDIS_IMAGE }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TOOLING_COMPOSE_PROJECT: web-starter-tooling-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 -B "${CANDIDATE_VALIDATION_ROOT}/scripts/rehearse_tooling_lifecycle.py" \
            --candidate-root "${CANDIDATE_VALIDATION_ROOT}" \
            --evidence-dir "${TOOLING_LIFECYCLE_DIR}" \
            --runtime-dir "${TOOLING_RUNTIME_DIR}" \
            --compose-project "${TOOLING_COMPOSE_PROJECT}" \
            --app-reference "${APP_REFERENCE}" \
            --nginx-reference "${NGINX_REFERENCE}" \
            --mysql-reference "${MYSQL_REFERENCE}" \
            --redis-reference "${REDIS_REFERENCE}" \
            --tag "${RELEASE_TAG}" \
            --version "${RELEASE_VERSION}" \
            --commit "${GITHUB_SHA}"

      - name: Run immutable-image empty-volume full-stack acceptance
