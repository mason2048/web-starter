            --compose-project "${TOOLING_COMPOSE_PROJECT}" \
            --output "${TOOLING_SUMMARY}"
          python3 -B - \
            "${TOOLING_SUMMARY}" \
            artifacts/acceptance/v2-tooling-lifecycle-runtime-summary.json <<'PY'
          from pathlib import Path
          import os
          import stat
          import sys

          source = Path(sys.argv[1]).resolve(strict=True)
          target = Path(sys.argv[2]).absolute()
          payload = source.read_bytes()
          if stat.S_IMODE(source.stat().st_mode) != 0o600:
              raise SystemExit("tooling private summary is not mode 0600")
          descriptor = os.open(
              target,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
              0o600,
          )
          with os.fdopen(descriptor, "wb") as stream:
              stream.write(payload)
          PY
          cmp -s "${TOOLING_SUMMARY}" \
            artifacts/acceptance/v2-tooling-lifecycle-runtime-summary.json

