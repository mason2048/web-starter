          def git(directory, *arguments):
              return subprocess.run(
                  ["git", "-C", str(directory), *arguments],
                  check=True,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              ).stdout.strip()
          def resolved_git_path(directory, *arguments):
              value = Path(git(directory, *arguments))
              if value.is_absolute():
                  return value.resolve()
              return (Path(directory) / value).resolve()
          if resolved_git_path(worktree, "rev-parse", "--show-toplevel") != worktree:
              raise SystemExit("candidate validation cleanup target is not its Git top-level")
          if git(worktree, "rev-parse", "HEAD^{commit}") != sys.argv[3]:
              raise SystemExit("candidate validation cleanup HEAD differs from the release commit")
          main_common = resolved_git_path(Path.cwd(), "rev-parse", "--git-common-dir")
          worktree_common = resolved_git_path(worktree, "rev-parse", "--git-common-dir")
          if worktree_common != main_common:
              raise SystemExit("candidate validation cleanup target is not a linked worktree")
          PY
          git worktree remove --force "${validation_root}"
          git worktree prune --expire now
          if [[ -e "${validation_root}" || -L "${validation_root}" ]]; then
            echo "candidate validation worktree still exists after exact cleanup" >&2
            exit 1
          fi

      - name: Checksum safe release evidence
        if: always()
        shell: bash
        run: |
          find artifacts -type f \
            ! -path 'artifacts/raw/*-secrets.json' \
            ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > artifacts/SHA256SUMS

      - name: Upload SBOM and sanitised release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-${{ steps.release.outputs.version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            artifacts/backend.cdx.json
            artifacts/frontend.cdx.json
            artifacts/app-image.cdx.json
            artifacts/nginx-image.cdx.json
            artifacts/release-images.json
            artifacts/security-gate-summary.json
            artifacts/release-evidence.json
            artifacts/production-compose.json
            artifacts/production-compose-policy.json
            artifacts/deployment-images.env
            artifacts/release-runtime-acceptance.json
            artifacts/runtime-version-identity.json
            artifacts/unified-verify-summary.json
            artifacts/oauth-runtime.json
            artifacts/runtime-production-compose-policy.json
            artifacts/runtime-compose-ps.json
            artifacts/acceptance/v2-v1-upgrade-rehearsal.json
            artifacts/acceptance/v2-ac40-dependency-seed-provenance.json
            artifacts/acceptance/v2-ac01-v1-source-provenance-summary.json
            artifacts/acceptance/v1-ac38-operations-documentation-summary.json
            artifacts/acceptance/v1-ac15-project-transport-parity-summary.json
            artifacts/acceptance/release-runtime-test-reports-summary.json
            artifacts/acceptance/v2-ac07-migration-failure.json
            artifacts/acceptance/v2-ac07-migration-failure.json.sha256
            artifacts/acceptance/v2-ac41-redis-loss.json
            artifacts/acceptance/v2-ac41-redis-loss.json.sha256
            artifacts/acceptance/v2-ac29-production-fail-fast.json
            artifacts/acceptance/v2-ac26-jwks-rotation-summary.json
            artifacts/acceptance/mcp-crud-runtime-proof-summary.json
            artifacts/acceptance/mcp-tool-contract-runtime-proof-summary.json
            artifacts/acceptance/mcp-governance-runtime-summary.json
            artifacts/acceptance/v2-credential-lifecycle-runtime-summary.json
            artifacts/acceptance/v2-observability-runtime-summary.json
            artifacts/acceptance/v2-tooling-lifecycle-runtime-summary.json
            artifacts/acceptance/v2-generator-acceptance-summary.json
            artifacts/raw/app-vulnerabilities.json
            artifacts/raw/nginx-vulnerabilities.json
            artifacts/SHA256SUMS

      - name: Resolve release image tags without overwrite
        id: release_tag_state
        shell: bash
        env:
          APP_IMAGE: ${{ steps.release.outputs.app_image }}
          APP_REFERENCE: ${{ steps.evidence.outputs.app_reference }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          NGINX_IMAGE: ${{ steps.release.outputs.nginx_image }}
          NGINX_REFERENCE: ${{ steps.evidence.outputs.nginx_reference }}
          NGINX_DIGEST: ${{ steps.nginx.outputs.digest }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          inspect_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er '.digest'
          }
          verify_candidate() {
            actual_digest="$(inspect_digest "$1")" || {
              echo "cannot resolve the already-scanned candidate digest" >&2
              exit 1
            }
            if [[ "${actual_digest}" != "$2" ]]; then
              echo "candidate digest changed after scanning" >&2
              exit 1
            fi
          }
          resolve_tag_state() {
            image="$1"
            expected_digest="$2"
            output_name="$3"
            error_file="/tmp/web-starter-${output_name}-tag-inspect-error"
            set +e
            manifest="$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --format '{{json .Manifest}}' 2>"${error_file}")"
            inspect_status=$?
            set -e
            if [[ ${inspect_status} -eq 0 ]]; then
              actual_digest="$(jq -er '.digest' <<<"${manifest}")" || {
                echo "existing release tag returned invalid manifest metadata" >&2
                exit 1
              }
              if [[ "${actual_digest}" != "${expected_digest}" ]]; then
                echo "refusing to overwrite a release tag bound to another digest" >&2
                exit 1
              fi
              echo "${output_name}=existing" >> "${GITHUB_OUTPUT}"
            elif grep -Eiq 'manifest unknown|no such manifest' "${error_file}"; then
              echo "${output_name}=absent" >> "${GITHUB_OUTPUT}"
            else
              echo "release tag state is unknown because registry inspection failed" >&2
              exit 1
            fi
          }
          verify_candidate "${APP_REFERENCE}" "${APP_DIGEST}"
          verify_candidate "${NGIN_REFERENCE}" "${NGIN_DIGEST}"
          resolve_tag_state "${APP_IMAGE}" "${APP_DIGEST}" app
          resolve_tag_state "${NGIN_IMAGE}" "${NGIN_DIGEST}" nginx

      - name: Promote scanned digests to release tags
        env:
          APP_IMAGE: ${{ steps.release.outputs.app_image }}
          NGINX_IMAGE: ${{ steps.release.outputs.nginx_image }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          APP_REFERENCE: ${{ steps.evidence.outputs.app_reference }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          APP_TAG_STATE: ${{ steps.release_tag_state.outputs.app }}
          NGINX_REFERENCE: ${{ steps.evidence.outputs.nginx_reference }}
          NGINX_DIGEST: ${{ steps.nginx.outputs.digest }}
          NGINX_TAG_STATE: ${{ steps.release_tag_state.outputs.nginx }}
        run: |
          promote_if_absent() {
            image="$1"
            source_reference="$2"
            expected_digest="$3"
            state="$4"
            if [[ "${state}" == "absent" ]]; then
              docker buildx imagetools create --tag "${image}:${RELEASE_TAG}" "${source_reference}"
            elif [[ "${state}" != "existing" ]]; then
              echo "release tag state was not established" >&2
              exit 1
            fi
            actual_digest="$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --format '{{json .Manifest}}' | jq -er '.digest')" || {
              echo "cannot verify promoted release tag digest" >&2
              exit 1
            }
            if [[ "${actual_digest}" != "${expected_digest}" ]]; then
              echo "promoted release tag does not resolve to the scanned digest" >&2
              exit 1
            fi
          }
          promote_if_absent "${APP_IMAGE}" "${APP_REFERENCE}" "${APP_DIGEST}" "${APP_TAG_STATE}"
          promote_if_absent "${NGIN_IMAGE}" "${NGIN_REFERENCE}" "${NGIN_DIGEST}" "${NGIN_TAG_STATE}"
