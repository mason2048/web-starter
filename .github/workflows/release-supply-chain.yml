          import stat
          import sys

          runner_requested = Path(sys.argv[1]).expanduser().absolute()
          if runner_requested.is_symlink() or not runner_requested.is_dir():
              raise SystemExit("V1 AC-15 cleanup RUNNER_TEMP is not a real directory")
          runner = runner_requested.resolve(strict=True)
          for supplied_text, expected_name in ((sys.argv[2], sys.argv[3]), (sys.argv[4], sys.argv[5])):
              expected = runner / expected_name
              if supplied_text and Path(supplied_text).expanduser().absolute() != expected:
                  raise SystemExit("V1 AC-15 cleanup path differs from the fixed RUNNER_TEMP path")
              if expected.parent != runner or not expected_name.startswith("web-starter-v1-ac15-"):
                  raise SystemExit("V1 AC-15 cleanup target is not the exact RUNNER_TEMP child")
              if expected.is_symlink():
                  raise SystemExit("V1 AC-15 cleanup refuses a symbolic link")
              if not expected.exists():
                  continue
              metadata = expected.stat()
              if not stat.S_ISDIR(metadata.st_mode) \
                      or stat.S_IMODE(metadata.st_mode) != 0o700 \
                      or metadata.st_uid != os.geteuid():
                  raise SystemExit("V1 AC-15 cleanup target is not owned mode 0700")
