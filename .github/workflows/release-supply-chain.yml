      - name: Remove the exact private V1 AC-38 evidence directory
        if: always()
        shell: bash
        env:
          V1_OPERATIONS_PROOF_DIR: ${{ steps.recovery.outputs.v1_operations_proof_dir }}
        run: |
          expected_dir="${RUNNER_TEMP}/web-starter-v1-ac38-operations-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -n "${V1_OPERATIONS_PROOF_DIR}" && \
                "${V1_OPERATIONS_PROOF_DIR}" != "${expected_dir}" ]]; then
            echo "V1 AC-38 cleanup path differs from the fixed RUNNER_TEMP path" >&2
            exit 1
          fi
          python3 -B - "${RUNNER_TEMP}" "${expected_dir}" <<'PY'
          from pathlib import Path
          import os
          import shutil
          import stat
          import sys

          runner = Path(sys.argv[1]).resolve(strict=True)
          target = Path(sys.argv[2]).absolute()
          if target.parent != runner \
                  or not target.name.startswith("web-starter-v1-ac38-operations-"):
              raise SystemExit("V1 AC-38 cleanup target is not the exact RUNNER_TEMP child")
          if target.is_symlink():
              raise SystemExit("V1 AC-38 cleanup refuses a symbolic link")
          if target.exists():
              metadata = target.stat()
              if not stat.S_ISDIR(metadata.st_mode) \
                      or stat.S_IMODE(metadata.st_mode) != 0o700 \
                      or metadata.st_uid != os.geteuid():
                  raise SystemExit("V1 AC-38 cleanup target is not owned mode 0700")
              shutil.rmtree(target)
          if target.exists() or target.is_symlink():
              raise SystemExit("V1 AC-38 private evidence remains after cleanup")
          PY

