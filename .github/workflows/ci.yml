name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test repository policy scanner
        run: python3 -B -m unittest discover -s scripts -p 'test_repository_policy.py'
      - name: Scan repository for committed secrets
        run: python3 -B scripts/repository_policy.py secrets

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-starter-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-starter-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  container-definition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        env:
          WEB_STARTER_DB_ROOT_PASSWORD: validation-only
          WEB_STARTER_DB_USERNAME: web_starter
          WEB_STARTER_DB_PASSWORD: validation-only
          WEB_STARTER_REDIS_PASSWORD: validation-only
          WEB_STARTER_TOKEN_PEPPER: validation-only-value-that-is-long-enough
          WEB_STARTER_BOOTSTRAP_ADMIN_PASSWORD: validation-only
        run: docker compose -f compose.yaml config --quiet
