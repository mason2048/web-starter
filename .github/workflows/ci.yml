name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Validate GitHub Actions workflows with pinned actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          install_root="$(mktemp -d "${RUNNER_TEMP}/web-starter-actionlint.XXXXXX")"
          archive="${install_root}/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${ACTIONLINT_LINUX_AMD64_SHA256}" "${archive}" \
            | sha256sum --check --strict -
          tar -xzf "${archive}" -C "${install_root}"
          "${install_root}/actionlint" -shellcheck= -color
      - name: Test repository and release policy scanners
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Scan repository for committed secrets
        run: python3 -B scripts/repository_policy.py secrets

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-starter-web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-starter-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  container-definition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Docker Compose serializer
        id: compose_cli
        shell: bash
        env:
          DOCKER_COMPOSE_VERSION: 5.3.1
          DOCKER_COMPOSE_LINUX_X86_64_SHA256: f9ebc6ebdb19d769b793c245a736caaeb198c62587f13b25c660c13b4987f959
        run: |
          set -euo pipefail
          install_root="$(mktemp -d "${RUNNER_TEMP}/web-starter-compose.XXXXXX")"
          binary="${install_root}/docker-compose"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --output "${binary}" \
            "https://github.com/docker/compose/releases/download/v${DOCKER_COMPOSE_VERSION}/docker-compose-linux-x86_64"
          printf '%s  %s\n' "${DOCKER_COMPOSE_LINUX_X86_64_SHA256}" "${binary}" \
            | sha256sum --check --strict -
          chmod 0755 "${binary}"
          test "$("${binary}" version --short)" = "${DOCKER_COMPOSE_VERSION}"
          printf 'binary=%s\n' "${binary}" >> "${GITHUB_OUTPUT}"
      - name: Validate Compose model
        env:
          WEB_STARTER_DB_ROOT_PASSWORD: validation-only
          WEB_STARTER_DB_USERNAME: web_starter
          WEB_STARTER_DB_PASSWORD: validation-only
          WEB_STARTER_REDIS_PASSWORD: validation-only
          WEB_STARTER_TOKEN_PEPPER: validation-only-value-that-is-long-enough
          WEB_STARTER_BOOTSTRAP_ADMIN_PASSWORD: validation-only
          WEB_STARTER_MANAGEMENT_USERNAME: validation_ops
          WEB_STARTER_MANAGEMENT_PASSWORD: validation-only-operations-password-0001
        run: '"${{ steps.compose_cli.outputs.binary }}" -f compose.yaml config --quiet'
      - name: Validate immutable hardened production Compose model
        env:
          WEB_STARTER_MYSQL_IMAGE: mysql:8.4@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WEB_STARTER_REDIS_IMAGE: redis:7.4-alpine@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          WEB_STARTER_APP_IMAGE: registry.example.invalid/web-starter/app
          WEB_STARTER_APP_DIGEST: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          WEB_STARTER_NGINX_IMAGE: registry.example.invalid/web-starter/nginx
          WEB_STARTER_NGINX_DIGEST: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          WEB_STARTER_DB_ROOT_PASSWORD: validation-only
          WEB_STARTER_DB_USERNAME: web_starter
          WEB_STARTER_DB_PASSWORD: validation-only
          WEB_STARTER_REDIS_PASSWORD: validation-only
          WEB_STARTER_TOKEN_PEPPER: validation-only-value-that-is-long-enough
          WEB_STARTER_MANAGEMENT_USERNAME: validation_ops
          WEB_STARTER_MANAGEMENT_PASSWORD: validation-only-operations-password-0001
          WEB_STARTER_OAUTH_ISSUER: https://web-starter.example.invalid
          WEB_STARTER_OAUTH_RESOURCE_AUDIENCE: https://mcp.example.invalid/mcp
          WEB_STARTER_MCP_ALLOWED_HOSTS: web-starter.example.invalid,mcp.example.invalid
          WEB_STARTER_MCP_ALLOWED_ORIGINS: https://web-starter.example.invalid,https://mcp.example.invalid
          WEB_STARTER_HTTP_BIND_ADDRESS: 127.0.0.1
          WEB_STARTER_GIT_COMMIT: ${{ github.sha }}
          WEB_STARTER_PUBLIC_TLS_CERT_FILE: /run/secrets/web-starter-cert.pem
          WEB_STARTER_PUBLIC_TLS_KEY_FILE: /run/secrets/web-starter-key.pem
        run: |
          "${{ steps.compose_cli.outputs.binary }}" -f compose.production.yaml config --format json > /tmp/web-starter-production-compose.json
          python3 -B scripts/production_compose_policy.py --compose-json /tmp/web-starter-production-compose.json
