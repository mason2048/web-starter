services:
  mcp-public-nginx:
    image: ${WEB_STARTER_NGINX_IMAGE:-web-starter-nginx}:${WEB_STARTER_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_STARTER_PUBLIC_MCP_BIND_ADDRESS:-0.0.0.0}:${WEB_STARTER_PUBLIC_MCP_PORT:-8443}:443"
    volumes:
      - type: bind
        source: ${WEB_STARTER_PUBLIC_TLS_CERT_FILE:?set WEB_STARTER_PUBLIC_TLS_CERT_FILE}
        target: /etc/nginx/tls/fullchain.pem
        read_only: true
      - type: bind
        source: ${WEB_STARTER_PUBLIC_TLS_KEY_FILE:?set WEB_STARTER_PUBLIC_TLS_KEY_FILE}
        target: /etc/nginx/tls/privkey.pem
        read_only: true
      - type: bind
        source: ./deploy/nginx/external-mcp.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app
