# Public MCP virtual host used by compose.public-mcp.yaml. The certificate and
# private key are mounted read-only at runtime and are never copied into the image.
limit_req_zone $binary_remote_addr zone=webstarter_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=webstarter_token:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=webstarter_mcp:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=webstarter_mcp_connections:10m;

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:webstarter_tls:10m;
    ssl_session_timeout 10m;
    server_tokens off;
    client_max_body_size 2m;
    limit_req_status 429;
    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Keep the public OAuth browser flow safe even during local dual-ingress
    # acceptance where the private HTTP management entry remains enabled.
    proxy_cookie_flags WEB_STARTER_SESSION secure httponly samesite=lax;
    proxy_cookie_flags XSRF-TOKEN secure samesite=lax;

    location ~ ^/mcp(?:/|$) {
        # One official SDK workflow performs initialization, discovery, Tool
        # calls, audit reads, stream setup, and explicit DELETE in a short
        # interval. Keep the 120/minute sustained IP limit while allowing a
        # one-minute burst so independent Agents behind the same NAT do not
        # reject each other's otherwise authorized sessions.
        limit_req zone=webstarter_mcp burst=120 nodelay;
        limit_conn webstarter_mcp_connections 10;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/web-starter-proxy-headers.conf;
        proxy_set_header X-Web-Starter-Ingress public;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Dynamic client registration is intentionally outside the product scope.
    # Reject the conventional endpoints at the public edge before CSRF or
    # application fallback behavior can make the boundary ambiguous.
    location = /connect/register {
        return 404;
    }

    location = /oauth2/register {
        return 404;
    }

    location ~ ^/(oauth2|\.well-known|connect)(?:/|$) {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/web-starter-proxy-headers.conf;
        proxy_set_header X-Web-Starter-Ingress public;
    }

    location = /oauth2/token {
        limit_req zone=webstarter_token burst=10 nodelay;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/web-starter-proxy-headers.conf;
        proxy_set_header X-Web-Starter-Ingress public;
    }

    location = /api/auth/login {
        limit_req zone=webstarter_login burst=5 nodelay;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/web-starter-proxy-headers.conf;
        proxy_set_header X-Web-Starter-Ingress public;
    }

    location ~ ^/api/auth/(?:logout|csrf|me)$ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/web-starter-proxy-headers.conf;
        proxy_set_header X-Web-Starter-Ingress public;
    }

    location = /login {
        try_files /index.html =404;
    }

    location ~* \.(?:css|js|svg|ico|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

# Container-local readiness endpoint. It is deliberately not bound to the
# public interface and verifies both Nginx and the upstream application.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    access_log off;

    location = /healthz {
        proxy_pass http://app:8081/actuator/health/readiness;
        proxy_http_version 1.1;
        proxy_set_header Host app;
    }

    location / {
        return 404;
    }
}
