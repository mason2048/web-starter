limit_req_zone $binary_remote_addr zone=webstarter_private_mcp:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=webstarter_private_mcp_connections:10m;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    limit_req_status 429;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^/mcp(?:/|$) {
        limit_req zone=webstarter_private_mcp burst=100 nodelay;
        limit_conn webstarter_private_mcp_connections 20;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/web-starter-proxy-headers.conf;
        proxy_set_header X-Web-Starter-Ingress private;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(api|oauth2|\.well-known|connect)(?:/|$) {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/web-starter-proxy-headers.conf;
        proxy_set_header X-Web-Starter-Ingress private;
    }

    location ~ ^/actuator/health(?:/|$) {
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/web-starter-proxy-headers.conf;
        proxy_set_header X-Web-Starter-Ingress private;
        access_log off;
    }

    location ~ ^/actuator(?:/|$) {
        return 404;
    }

    location / {
        # Do not probe physical directories here. Vite emits /assets as a
        # directory, while a copied business module may legitimately use
        # /assets as a client-side route. Extension-bearing static files are
        # handled by the location below; every other route gets the SPA shell.
        try_files $uri /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Nginx does not inherit server-level add_header directives when a
        # location defines its own header, so repeat the security headers here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }
}
