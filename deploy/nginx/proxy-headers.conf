proxy_set_header Host $webstarter_forwarded_host;
proxy_set_header X-Real-IP $remote_addr;
# The edge replaces, rather than appends to, client-supplied forwarding headers.
# Configure real_ip with explicit trusted proxy CIDRs before placing another
# load balancer in front of this Nginx instance.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $webstarter_forwarded_host;
proxy_set_header X-Forwarded-Port $webstarter_forwarded_port;
proxy_set_header X-Forwarded-Proto $scheme;
