# Preserve the authority observed by the client while never trusting an
# incoming X-Forwarded-* header. Docker port publishing is not visible through
# $server_port, so derive an explicit external port from Host when present.
map $http_host $webstarter_forwarded_host {
    ""      $host;
    default $http_host;
}

map $scheme $webstarter_default_forwarded_port {
    http    80;
    https   443;
}

map $webstarter_forwarded_host $webstarter_forwarded_port {
    ~:(?<webstarter_explicit_port>[0-9]+)$ $webstarter_explicit_port;
    default                                $webstarter_default_forwarded_port;
}
