spring:
  application:
    name: web-starter-admin
  threads:
    virtual:
      enabled: ${WEB_STARTER_VIRTUAL_THREADS_ENABLED:true}
  datasource:
    url: ${WEB_STARTER_DB_URL:jdbc:mysql://127.0.0.1:3306/web_starter?useUnicode=true&characterEncoding=utf8&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${WEB_STARTER_DB_USERNAME:web_starter}
    password: ${WEB_STARTER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${WEB_STARTER_DB_POOL_MAX_SIZE:20}
      minimum-idle: ${WEB_STARTER_DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  data:
    redis:
      host: ${WEB_STARTER_REDIS_HOST:127.0.0.1}
      port: ${WEB_STARTER_REDIS_PORT:6379}
      password: ${WEB_STARTER_REDIS_PASSWORD:}
      database: ${WEB_STARTER_REDIS_DATABASE:0}
      timeout: 3s
  session:
    timeout: ${WEB_STARTER_SESSION_TIMEOUT:8h}
    data:
      redis:
        namespace: web-starter:session
        flush-mode: on-save
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

server:
  port: ${WEB_STARTER_SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: WEB_STARTER_SESSION
        http-only: true
        secure: ${WEB_STARTER_COOKIE_SECURE:false}
        same-site: lax

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: 启程 Web Starter
    version: 2.0.0-SNAPSHOT
    runtime: Java 21 / Spring Boot 4.1

web-starter:
  bootstrap-admin:
    username: ${WEB_STARTER_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${WEB_STARTER_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${WEB_STARTER_BOOTSTRAP_ADMIN_DISPLAY_NAME:系统管理员}
  security:
    token-pepper: ${WEB_STARTER_TOKEN_PEPPER:}
    issuer: ${WEB_STARTER_OAUTH_ISSUER:http://127.0.0.1:8080}
    resource-audience: ${WEB_STARTER_OAUTH_RESOURCE_AUDIENCE:http://127.0.0.1:8080/mcp}
    internal-tokens-enabled: ${WEB_STARTER_INTERNAL_TOKENS_ENABLED:true}
    development-keys-allowed: ${WEB_STARTER_OAUTH_DEVELOPMENT_KEYS_ALLOWED:false}
    rsa-private-key: ${WEB_STARTER_OAUTH_RSA_PRIVATE_KEY:}
    rsa-public-key: ${WEB_STARTER_OAUTH_RSA_PUBLIC_KEY:}
    access-token-ttl: ${WEB_STARTER_OAUTH_ACCESS_TOKEN_TTL:10m}
    refresh-token-ttl: ${WEB_STARTER_OAUTH_REFRESH_TOKEN_TTL:8h}
  mcp:
    allowed-hosts: "${WEB_STARTER_MCP_ALLOWED_HOSTS:localhost,localhost:*,127.0.0.1,127.0.0.1:*,[::1],[::1]:*}"
    allowed-origins: "${WEB_STARTER_MCP_ALLOWED_ORIGINS:http://localhost,http://localhost:*,https://localhost,https://localhost:*,http://127.0.0.1,http://127.0.0.1:*,https://127.0.0.1,https://127.0.0.1:*,http://[::1],http://[::1]:*,https://[::1],https://[::1]:*}"

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    root: INFO
    dev.webstarter: ${WEB_STARTER_LOG_LEVEL:INFO}
